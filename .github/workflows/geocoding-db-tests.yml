name: Geocoding database checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/reviewed-location-geocoding]

permissions:
  contents: read

concurrency:
  group: geocoding-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: PostgreSQL 17 / PostGIS migration and guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: dutyperks_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dutyperks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dutyperks_test
      PGUSER: postgres
      PGPASSWORD: ephemeral-ci-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create representative Supabase database roles
        run: >-
          psql -v ON_ERROR_STOP=1 -c
          "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;"
      - name: Set up existing application schema in the disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Apply geocoding setup twice to verify repeatability
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/geocoding.sql
          psql -v ON_ERROR_STOP=1 -f supabase/geocoding.sql
      - name: Check approval, stale-data, MWR-role and access guards
        run: psql -v ON_ERROR_STOP=1 -f supabase/test_geocoding.sql
      - name: Verify test fixtures rolled back
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (SELECT 1 FROM public.locations)
              OR EXISTS (SELECT 1 FROM public.location_geocode_reviews) THEN
              RAISE EXCEPTION 'Disposable test fixtures were not rolled back';
            END IF;
          END $$;
          SQL
      - name: Run address-lookup and existing unit tests
        run: node --test tests/*.test.mjs

